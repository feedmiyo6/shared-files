    <script>
        const questions = [
            {
                q_en: "Which block type should you use for purely combinational logic (no storage)?",
                q_ko: "순수 조합 논리(저장 없음)에 어떤 블록 유형을 사용해야 합니까?",
                options: [
                    { text: "always_ff", correct: false },
                    { text: "always_comb", correct: true },
                    { text: "always @(*)", correct: false },
                    { text: "initial", correct: false }
                ],
                exp_en: "always_comb is specifically designed for combinational logic. It automatically infers sensitivity to all read signals and executes at time 0.",
                exp_ko: "always_comb는 조합 논리를 위해 특별히 설계되었습니다. 모든 읽기 신호에 대한 감도를 자동으로 추론하고 시간 0에 실행됩니다."
            },
            {
                q_en: "What type of assignment should be used inside always_ff?",
                q_ko: "always_ff 내부에서 어떤 유형의 할당을 사용해야 합니까?",
                options: [
                    { text: "Blocking (=)", correct: false },
                    { text: "Non-blocking (<=)", correct: true },
                    { text: "Either one works fine", correct: false },
                    { text: "Continuous (assign)", correct: false }
                ],
                exp_en: "always_ff uses non-blocking assignments (<=) to ensure proper simulation of sequential behavior. All assignments happen simultaneously at the clock edge.",
                exp_ko: "always_ff는 순차적 동작의 올바른 시뮬레이션을 보장하기 위해 논블로킹 할당(<=)을 사용합니다. 모든 할당은 클럭 에지에서 동시에 발생합니다."
            },
            {
                q_en: "What hardware element does always_ff create?",
                q_ko: "always_ff는 어떤 하드웨어 요소를 생성합니까?",
                options: [
                    { text: "Multiplexers only", correct: false },
                    { text: "AND/OR gates only", correct: false },
                    { text: "Flip-flops (registers)", correct: true },
                    { text: "Latches", correct: false }
                ],
                exp_en: "always_ff creates flip-flops, which are edge-triggered storage elements. This is what gives sequential logic its 'memory' — the ability to hold state between clock edges.",
                exp_ko: "always_ff는 에지 트리거 저장 요소인 플립플롭을 생성합니다. 이것이 순차 논리에 '메모리'를 제공합니다 — 클럭 에지 사이에 상태를 유지하는 능력입니다."
            },
            {
                q_en: "What happens if you don't assign a variable in all paths of always_comb?",
                q_ko: "always_comb의 모든 경로에서 변수를 할당하지 않으면 어떻게 됩니까?",
                options: [
                    { text: "The variable becomes 'X' (undefined)", correct: false },
                    { text: "The compiler generates an error", correct: false },
                    { text: "A latch is inferred (unintended!)", correct: true },
                    { text: "Nothing, it's fine", correct: false }
                ],
                exp_en: "If a variable isn't assigned in all code paths, synthesis tools infer a latch to 'remember' the old value. This is almost always a bug — latches are timing-hazardous and should be avoided.",
                exp_ko: "변수가 모든 코드 경로에서 할당되지 않으면 합성 도구는 이전 값을 '기억'하기 위해 래치를 추론합니다. 이것은 거의 항상 버그입니다 — 래치는 타이밍 위험하며 피해야 합니다."
            },
            {
                q_en: "What is the sensitivity list for always_comb?",
                q_ko: "always_comb의 감도 목록은 무엇입니까?",
                options: [
                    { text: "You must specify it manually", correct: false },
                    { text: "Only the clock signal", correct: false },
                    { text: "Automatic — all read signals", correct: true },
                    { text: "Empty — no sensitivity", correct: false }
                ],
                exp_en: "always_comb automatically builds its sensitivity list from all signals that are read within the block. This prevents common bugs from forgetting to include signals.",
                exp_ko: "always_comb는 블록 내에서 읽히는 모든 신호로부터 자동으로 감도 목록을 구축합니다. 이것은 신호 포함을 잊어버리는 일반적인 버그를 방지합니다."
            },
            {
                q_en: "Look at this code. What's wrong?\n\nalways_ff @(posedge clk) begin\n    a = b;\n    c = a;\nend",
                q_ko: "이 코드를 보세요. 무엇이 잘못되었습니까?\n\nalways_ff @(posedge clk) begin\n    a = b;\n    c = a;\nend",
                options: [
                    { text: "Missing reset", correct: false },
                    { text: "Using blocking (=) instead of non-blocking (<=)", correct: true },
                    { text: "Missing sensitivity list", correct: false },
                    { text: "Nothing is wrong", correct: false }
                ],
                exp_en: "In always_ff, you should use non-blocking (<=). With blocking, 'c = a' gets the NEW value of 'a' immediately, which doesn't model real flip-flop behavior where all outputs update simultaneously.",
                exp_ko: "always_ff에서는 논블로킹(<=)을 사용해야 합니다. 블로킹을 사용하면 'c = a'가 즉시 'a'의 새 값을 가져오는데, 이는 모든 출력이 동시에 업데이트되는 실제 플립플롭 동작을 모델링하지 않습니다."
            },
            {
                q_en: "Which statement about always_comb is TRUE?",
                q_ko: "always_comb에 대한 어떤 설명이 참입니까?",
                options: [
                    { text: "It requires a clock signal", correct: false },
                    { text: "It executes once at simulation start (time 0)", correct: true },
                    { text: "It creates flip-flops", correct: false },
                    { text: "It can have feedback (output depends on itself)", correct: false }
                ],
                exp_en: "always_comb executes once at time 0 to establish initial output values, then re-executes whenever any input changes. Feedback would create a combinational loop, which is forbidden.",
                exp_ko: "always_comb는 시간 0에 한 번 실행되어 초기 출력 값을 설정한 다음, 입력이 변경될 때마다 다시 실행됩니다. 피드백은 조합 루프를 생성하는데, 이는 금지됩니다."
            },
            {
                q_en: "When designing a counter, which block type should you use?",
                q_ko: "카운터를 설계할 때 어떤 블록 유형을 사용해야 합니까?",
                options: [
                    { text: "always_comb — counters are just adders", correct: false },
                    { text: "always_ff — counters need to hold state", correct: true },
                    { text: "Both work equally well", correct: false },
                    { text: "initial block", correct: false }
                ],
                exp_en: "Counters must remember their current value to increment it. This requires state storage (flip-flops), which means always_ff. The counter value persists across clock cycles.",
                exp_ko: "카운터는 증가시키기 위해 현재 값을 기억해야 합니다. 이것은 상태 저장(플립플롭)이 필요하며, always_ff를 의미합니다. 카운터 값은 클럭 사이클에 걸쳐 지속됩니다."
            },
            {
                q_en: "What does 'posedge clk' mean in always_ff @(posedge clk)?",
                q_ko: "always_ff @(posedge clk)에서 'posedge clk'는 무엇을 의미합니까?",
                options: [
                    { text: "Execute when clock is high", correct: false },
                    { text: "Execute on rising edge of clock (0→1 transition)", correct: true },
                    { text: "Execute when clock is low", correct: false },
                    { text: "Execute on both edges", correct: false }
                ],
                exp_en: "posedge means 'positive edge' — the moment when the clock transitions from 0 to 1. This is when flip-flops capture their input values. negedge would be the falling edge (1→0).",
                exp_ko: "posedge는 '양의 에지'를 의미합니다 — 클럭이 0에서 1로 전환되는 순간입니다. 이것은 플립플롭이 입력 값을 캡처하는 때입니다. negedge는 하강 에지(1→0)입니다."
            },
            {
                q_en: "Look at this case statement. What's the problem?\n\nalways_comb begin\n    case (sel)\n        2'b00: y = a;\n        2'b01: y = b;\n        2'b10: y = c;\n    endcase\nend",
                q_ko: "이 case 문을 보세요. 문제가 무엇입니까?\n\nalways_comb begin\n    case (sel)\n        2'b00: y = a;\n        2'b01: y = b;\n        2'b10: y = c;\n    endcase\nend",
                options: [
                    { text: "Should use always_ff", correct: false },
                    { text: "Missing case 2'b11 — latch will be inferred", correct: true },
                    { text: "Should use non-blocking (<=)", correct: false },
                    { text: "Nothing is wrong", correct: false }
                ],
                exp_en: "When sel=2'b11, y has no assignment. The tool infers a latch to hold the previous value. Fix: add 'default: y = d;' or '2'b11: y = d;' to cover all cases.",
                exp_ko: "sel=2'b11일 때, y에 할당이 없습니다. 도구는 이전 값을 유지하기 위해 래치를 추론합니다. 수정: 모든 경우를 포함하려면 'default: y = d;' 또는 '2'b11: y = d;'를 추가하세요."
            },
            {
                q_en: "What type of assignment should be used inside always_comb?",
                q_ko: "always_comb 내부에서 어떤 유형의 할당을 사용해야 합니까?",
                options: [
                    { text: "Non-blocking (<=)", correct: false },
                    { text: "Blocking (=)", correct: true },
                    { text: "Either one", correct: false },
                    { text: "Continuous (assign)", correct: false }
                ],
                exp_en: "always_comb uses blocking (=) assignments. In combinational logic, we WANT sequential execution within the block so intermediate calculations are available immediately.",
                exp_ko: "always_comb는 블로킹(=) 할당을 사용합니다. 조합 논리에서는 중간 계산이 즉시 사용 가능하도록 블록 내 순차 실행을 원합니다."
            },
            {
                q_en: "Which correctly describes the output behavior?\n\n• A: always_comb output\n• B: always_ff output",
                q_ko: "출력 동작을 올바르게 설명하는 것은?\n\n• A: always_comb 출력\n• B: always_ff 출력",
                options: [
                    { text: "A changes on clock edge, B changes immediately", correct: false },
                    { text: "A changes immediately, B changes on clock edge", correct: true },
                    { text: "Both change on clock edge", correct: false },
                    { text: "Both change immediately", correct: false }
                ],
                exp_en: "Combinational logic (always_comb) has no clock — outputs change as soon as inputs change (after propagation delay). Sequential logic (always_ff) only updates outputs at clock edges.",
                exp_ko: "조합 논리(always_comb)는 클럭이 없습니다 — 출력은 입력이 변경되면 즉시 변경됩니다(전파 지연 후). 순차 논리(always_ff)는 클럭 에지에서만 출력을 업데이트합니다."
            },
            {
                q_en: "What's the purpose of 'rst_n' in this code?\n\nalways_ff @(posedge clk or negedge rst_n) begin\n    if (!rst_n)\n        q <= 8'h00;\n    else\n        q <= d;\nend",
                q_ko: "이 코드에서 'rst_n'의 목적은 무엇입니까?\n\nalways_ff @(posedge clk or negedge rst_n) begin\n    if (!rst_n)\n        q <= 8'h00;\n    else\n        q <= d;\nend",
                options: [
                    { text: "Clock gating signal", correct: false },
                    { text: "Asynchronous reset (active low)", correct: true },
                    { text: "Enable signal", correct: false },
                    { text: "Output buffer control", correct: false }
                ],
                exp_en: "rst_n is an asynchronous reset. The 'n' suffix means 'active-low' — when rst_n=0, the register resets. It's in the sensitivity list (negedge rst_n) so reset happens immediately, not waiting for clock.",
                exp_ko: "rst_n은 비동기 리셋입니다. 'n' 접미사는 '액티브-로우'를 의미합니다 — rst_n=0일 때 레지스터가 리셋됩니다. 감도 목록(negedge rst_n)에 있어 클럭을 기다리지 않고 즉시 리셋됩니다."
            },
            {
                q_en: "Which is a valid use case for always_comb?",
                q_ko: "always_comb의 유효한 사용 사례는?",
                options: [
                    { text: "D flip-flop", correct: false },
                    { text: "4-bit counter", correct: false },
                    { text: "2-to-4 decoder", correct: true },
                    { text: "Shift register", correct: false }
                ],
                exp_en: "A decoder is pure combinational logic — outputs depend only on current inputs, no memory needed. D flip-flops, counters, and shift registers all need to store state, requiring always_ff.",
                exp_ko: "디코더는 순수 조합 논리입니다 — 출력은 현재 입력에만 의존하고 메모리가 필요 없습니다. D 플립플롭, 카운터, 시프트 레지스터는 모두 상태를 저장해야 하므로 always_ff가 필요합니다."
            },
            {
                q_en: "In this pipeline pattern, why separate the combinational and sequential logic?\n\nalways_comb begin\n    result = a + b;\nend\n\nalways_ff @(posedge clk) begin\n    reg_out <= result;\nend",
                q_ko: "이 파이프라인 패턴에서 왜 조합 논리와 순차 논리를 분리합니까?\n\nalways_comb begin\n    result = a + b;\nend\n\nalways_ff @(posedge clk) begin\n    reg_out <= result;\nend",
                options: [
                    { text: "Required by SystemVerilog syntax", correct: false },
                    { text: "Reduces area", correct: false },
                    { text: "Cleaner code, easier timing closure, ready for pipelining", correct: true },
                    { text: "Runs faster in simulation", correct: false }
                ],
                exp_en: "Separating logic types makes code more readable and maintainable. Registered outputs are timing-friendly (predictable arrival times). The pattern also makes it easy to add pipeline stages later.",
                exp_ko: "논리 유형을 분리하면 코드가 더 읽기 쉽고 유지보수하기 쉬워집니다. 레지스터 출력은 타이밍에 친화적입니다(예측 가능한 도착 시간). 이 패턴은 나중에 파이프라인 단계를 추가하기도 쉽게 만듭니다."
            },
            {
                q_en: "Which block type would you use for a MUX (multiplexer)?",
                q_ko: "MUX(멀티플렉서)에 어떤 블록 유형을 사용하시겠습니까?",
                options: [
                    { text: "always_ff — MUXes need flip-flops", correct: false },
                    { text: "always_comb — MUX is combinational", correct: true },
                    { text: "initial — to set up the MUX", correct: false },
                    { text: "always_latch", correct: false }
                ],
                exp_en: "A MUX is pure combinational logic — it just selects one of its inputs based on the select signal. No storage, no clock needed. Output changes immediately when inputs change.",
                exp_ko: "MUX는 순수 조합 논리입니다 — 선택 신호에 따라 입력 중 하나를 선택할 뿐입니다. 저장도 클럭도 필요 없습니다. 입력이 변경되면 출력이 즉시 변경됩니다."
            },
            {
                q_en: "What does this code create?\n\nalways_ff @(posedge clk) begin\n    if (en)\n        q <= d;\nend",
                q_ko: "이 코드는 무엇을 생성합니까?\n\nalways_ff @(posedge clk) begin\n    if (en)\n        q <= d;\nend",
                options: [
                    { text: "A latch (because no else clause)", correct: false },
                    { text: "A register with enable (q holds value when en=0)", correct: true },
                    { text: "A combinational MUX", correct: false },
                    { text: "Syntax error", correct: false }
                ],
                exp_en: "In always_ff, NOT assigning a variable in some paths is intentional — it means 'hold the current value'. This is a register with clock enable. Without 'en', the flip-flop keeps its previous value.",
                exp_ko: "always_ff에서 일부 경로에서 변수를 할당하지 않는 것은 의도적입니다 — '현재 값을 유지'를 의미합니다. 이것은 클럭 인에이블이 있는 레지스터입니다. 'en' 없이는 플립플롭이 이전 값을 유지합니다."
            },
            {
                q_en: "Which statement about old-style 'always @(*)' vs 'always_comb' is TRUE?",
                q_ko: "구식 'always @(*)'와 'always_comb'에 대한 어떤 설명이 참입니까?",
                options: [
                    { text: "They are exactly identical", correct: false },
                    { text: "always_comb also runs at time 0 and checks for latches", correct: true },
                    { text: "always @(*) is preferred in modern code", correct: false },
                    { text: "always @(*) creates flip-flops", correct: false }
                ],
                exp_en: "always_comb has extra checks: it runs once at time 0, warns about latches, and forbids blocking assignments to variables written by other processes. Use always_comb for new code.",
                exp_ko: "always_comb는 추가 검사가 있습니다: 시간 0에 한 번 실행하고, 래치에 대해 경고하며, 다른 프로세스가 쓴 변수에 대한 블로킹 할당을 금지합니다. 새 코드에는 always_comb를 사용하세요."
            }
        ];

        let score = 0;
        let answered = new Array(questions.length).fill(false);
        let isKorean = false;

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = questions.map((q, idx) => `
                <div class="question-card" id="q${idx}">
                    <div class="question-num">Question ${idx + 1} / ${questions.length}</div>
                    <div class="question-text">
                        <span class="en">${q.q_en.replace(/\n/g, '<br>')}</span>
                        <span class="ko">${q.q_ko.replace(/\n/g, '<br>')}</span>
                    </div>
                    <div class="options">
                        ${q.options.map((opt, optIdx) => `
                            <div class="option" id="q${idx}o${optIdx}" onclick="selectOption(${idx}, ${optIdx}, ${opt.correct})">
                                <div class="option-label">
                                    <span class="option-letter">${String.fromCharCode(65 + optIdx)}</span>
                                    <span>${opt.text}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="explanation" id="exp${idx}">
                        <div class="explanation-title">
                            <span class="en">💡 Explanation</span>
                            <span class="ko">💡 설명</span>
                        </div>
                        <p class="en">${q.exp_en}</p>
                        <p class="ko">${q.exp_ko}</p>
                    </div>
                </div>
            `).join('');
            updateLangDisplay();
        }

        function selectOption(qIdx, optIdx, isCorrect) {
            if (answered[qIdx]) return;
            
            answered[qIdx] = true;
            const optionEl = document.getElementById(`q${qIdx}o${optIdx}`);
            
            if (isCorrect) {
                optionEl.classList.add('correct');
                score++;
            } else {
                optionEl.classList.add('incorrect');
                // Show correct answer
                questions[qIdx].options.forEach((opt, idx) => {
                    if (opt.correct) {
                        document.getElementById(`q${qIdx}o${idx}`).classList.add('correct');
                    }
                });
            }
            
            // Show explanation
            document.getElementById(`exp${qIdx}`).classList.add('show');
            
            // Update score
            document.getElementById('score').textContent = score;
            document.getElementById('progress').style.width = `${(answered.filter(a => a).length / questions.length) * 100}%`;
        }

        function resetQuiz() {
            score = 0;
            answered = new Array(questions.length).fill(false);
            document.getElementById('score').textContent = '0';
            document.getElementById('progress').style.width = '0%';
            renderQuiz();
        }

        function toggleLang() {
            isKorean = !isKorean;
            updateLangDisplay();
            document.querySelector('.lang-toggle').textContent = isKorean ? '🇺🇸 English' : '🇰🇷 한국어';
        }

        function updateLangDisplay() {
            document.querySelectorAll('.en').forEach(el => {
                el.style.setProperty('display', isKorean ? 'none' : 'revert', 'important');
            });
            document.querySelectorAll('.ko').forEach(el => {
                el.style.setProperty('display', isKorean ? 'revert' : 'none', 'important');
            });
        }

        // Initialize
        renderQuiz();
    </script>
</body>
</html>
