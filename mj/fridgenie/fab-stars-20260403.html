<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAB Star Designs</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #F4EFE7; font-family: Inter, -apple-system, sans-serif; padding: 20px; }
h1 { text-align: center; color: #B63F39; font-size: 22px; margin: 20px 0 8px; font-weight: 600; }
p.sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 30px; }
.grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; }
.option { text-align: center; }
.option .label { margin-top: 12px; font-size: 14px; font-weight: 600; color: #333; }
.option .desc { font-size: 11px; color: #888; margin-top: 4px; max-width: 140px; margin-inline: auto; }
</style>
</head>
<body>
<h1>FAB Star Options</h1>
<p class="sub">4-point star, hollow center, points touching circle edge</p>
<div class="grid" id="grid"></div>

<script>
const RED = '#B63F39';
const BG = '#F6E2DF';
const SIZE = 120; // canvas pixels (2x for retina)
const DISPLAY = 100; // CSS display size

const options = [
  { id: 'A', name: 'Thin Sparkle', desc: 'Thin stroke (2px), elegant', outerR: 0.44, innerR: 0.08, sw: 2.5, curves: true },
  { id: 'B', name: 'Medium Sparkle', desc: 'Medium stroke (3px), balanced', outerR: 0.44, innerR: 0.09, sw: 3.5, curves: true },
  { id: 'C', name: 'Bold Sparkle', desc: 'Thicker stroke (4px), confident', outerR: 0.44, innerR: 0.09, sw: 5, curves: true },
  { id: 'D', name: 'Pinched Sparkle', desc: 'Tight pinch, sharp center', outerR: 0.44, innerR: 0.04, sw: 3.5, curves: true },
  { id: 'E', name: 'Wide Sparkle', desc: 'Wider curves, soft & round', outerR: 0.44, innerR: 0.16, sw: 3.5, curves: true },
  { id: 'F', name: 'Classic Star', desc: 'Straight edges, geometric', outerR: 0.44, innerR: 0.10, sw: 3.5, curves: false },
];

const grid = document.getElementById('grid');

options.forEach(opt => {
  const div = document.createElement('div');
  div.className = 'option';

  const canvas = document.createElement('canvas');
  canvas.width = SIZE * 2;  // retina
  canvas.height = SIZE * 2;
  canvas.style.width = DISPLAY + 'px';
  canvas.style.height = DISPLAY + 'px';
  canvas.style.borderRadius = '50%';
  canvas.style.boxShadow = '0 4px 14px rgba(0,0,0,0.12)';

  const ctx = canvas.getContext('2d');
  const s = SIZE * 2;
  const cx = s / 2;
  const cy = s / 2;

  // Background circle
  ctx.beginPath();
  ctx.arc(cx, cy, s / 2, 0, Math.PI * 2);
  ctx.fillStyle = BG;
  ctx.fill();

  // Star
  const oR = s * opt.outerR;
  const iR = s * opt.innerR;
  ctx.strokeStyle = RED;
  ctx.lineWidth = opt.sw * 2; // scale for retina
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.beginPath();
  if (opt.curves) {
    ctx.moveTo(cx, cy - oR);
    ctx.quadraticBezierTo(cx + iR, cy - iR, cx + oR, cy);
    ctx.quadraticBezierTo(cx + iR, cy + iR, cx, cy + oR);
    ctx.quadraticBezierTo(cx - iR, cy + iR, cx - oR, cy);
    ctx.quadraticBezierTo(cx - iR, cy - iR, cx, cy - oR);
  } else {
    ctx.moveTo(cx, cy - oR);
    ctx.lineTo(cx + iR, cy - iR);
    ctx.lineTo(cx + oR, cy);
    ctx.lineTo(cx + iR, cy + iR);
    ctx.lineTo(cx, cy + oR);
    ctx.lineTo(cx - iR, cy + iR);
    ctx.lineTo(cx - oR, cy);
    ctx.lineTo(cx - iR, cy - iR);
    ctx.closePath();
  }
  ctx.stroke();

  div.appendChild(canvas);
  div.innerHTML += `<div class="label">${opt.id} — ${opt.name}</div><div class="desc">${opt.desc}</div>`;
  grid.appendChild(div);
});
</script>
</body>
</html>
