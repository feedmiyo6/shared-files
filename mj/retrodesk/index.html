Apps.notepad = function(filePath, fileContent) {
  const win = WM.createWindow({
    title: filePath ? filePath.split('/').pop() + ' - Notepad' : 'Untitled - Notepad',
    icon: '📝', appType: 'notepad',
    width: 500, height: 400, minWidth: 300, minHeight: 200,
    menubar: `
      <span class="menu-item" data-menu="file">File</span>
      <span class="menu-item" data-menu="edit">Edit</span>
      <span class="menu-item" data-menu="help">Help</span>
    `,
    body: `<textarea class="notepad-textarea" spellcheck="false">${fileContent ? fileContent.replace(/</g,'&lt;') : ''}</textarea>`,
    statusbar: 'Ln 1, Col 1',
  });

  const textarea = win.body.querySelector('.notepad-textarea');
  let currentPath = filePath || null;
  let modified = false;

  textarea.addEventListener('input', () => {
    modified = true;
    const title = (currentPath ? currentPath.split('/').pop() : 'Untitled') + '* - Notepad';
    win.el.querySelector('.win-title').textContent = title;
  });

  textarea.addEventListener('keyup', () => {
    const lines = textarea.value.substring(0, textarea.selectionStart).split('\n');
    const ln = lines.length;
    const col = lines[lines.length - 1].length + 1;
    win.el.querySelector('.window-statusbar').textContent = `Ln ${ln}, Col ${col}`;
  });

  function saveFile() {
    if (!currentPath) {
      // Prompt for filename
      showSaveDialog();
    } else {
      VFS.writeFile(currentPath, textarea.value);
      modified = false;
      win.el.querySelector('.win-title').textContent = currentPath.split('/').pop() + ' - Notepad';
    }
  }

  function showSaveDialog() {
    const dialog = document.createElement('div');
    dialog.className = 'notepad-dialog';
    dialog.innerHTML = `
      <label>File name:</label>
      <input type="text" value="untitled.txt" id="np-save-name">
      <label>Save in: /home/Documents/</label>
      <div class="dialog-buttons">
        <button class="retro-btn" id="np-save-ok">Save</button>
        <button class="retro-btn" id="np-save-cancel">Cancel</button>
      </div>
    `;
    win.body.appendChild(dialog);
    const nameInput = dialog.querySelector('#np-save-name');
    nameInput.focus();
    nameInput.select();

    dialog.querySelector('#np-save-ok').addEventListener('click', () => {
      const name = nameInput.value.trim();
      if (name) {
        currentPath = '/home/Documents/' + name;
        VFS.writeFile(currentPath, textarea.value);
        modified = false;
        win.el.querySelector('.win-title').textContent = name + ' - Notepad';
      }
      dialog.remove();
    });
    dialog.querySelector('#np-save-cancel').addEventListener('click', () => dialog.remove());
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') dialog.querySelector('#np-save-ok').click(); });
  }

  function showFindReplace() {
    // Remove existing dialog
    const existing = win.body.querySelector('.notepad-dialog');
    if (existing) { existing.remove(); return; }

    const dialog = document.createElement('div');
    dialog.className = 'notepad-dialog';
    dialog.innerHTML = `
      <label>Find:</label>
      <input type="text" id="np-find-input">
      <label>Replace with:</label>
      <input type="text" id="np-replace-input">
      <div class="dialog-buttons">
        <button class="retro-btn" id="np-find-next">Find Next</button>
        <button class="retro-btn" id="np-replace-btn">Replace</button>
        <button class="retro-btn" id="np-replace-all">Replace All</button>
        <button class="retro-btn" id="np-find-close">Close</button>
      </div>
    `;
    win.body.appendChild(dialog);
    dialog.querySelector('#np-find-input').focus();

    let lastIdx = -1;

    dialog.querySelector('#np-find-next').addEventListener('click', () => {
      const query = dialog.querySelector('#np-find-input').value;
      if (!query) return;
      const text = textarea.value;
      const idx = text.indexOf(query, lastIdx + 1);
      if (idx !== -1) {
        textarea.focus();
        textarea.setSelectionRange(idx, idx + query.length);
        lastIdx = idx;
      } else {
        lastIdx = -1;
        showMsgBox('Notepad', `Cannot find "${query}"`, 'ℹ️');
      }
    });

    dialog.querySelector('#np-replace-btn').addEventListener('click', () => {
      const query = dialog.querySelector('#np-find-input').value;
      const repl = dialog.querySelector('#np-replace-input').value;
      if (!query) return;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selected = textarea.value.substring(start, end);
      if (selected === query) {
        textarea.value = textarea.value.substring(0, start) + repl + textarea.value.substring(end);
        textarea.setSelectionRange(start, start + repl.length);
        modified = true;
      }
    });

    dialog.querySelector('#np-replace-all').addEventListener('click', () => {
      const query = dialog.querySelector('#np-find-input').value;
      const repl = dialog.querySelector('#np-replace-input').value;
      if (!query) return;
      const count = textarea.value.split(query).length - 1;
      textarea.value = textarea.value.split(query).join(repl);
      modified = true;
      showMsgBox('Notepad', `Replaced ${count} occurrence(s).`, 'ℹ️');
    });

    dialog.querySelector('#np-find-close').addEventListener('click', () => dialog.remove());
  }

  function openFile() {
    const dialog = document.createElement('div');
    dialog.className = 'notepad-dialog';
    dialog.innerHTML = `
      <label>File path:</label>
      <input type="text" value="/home/Documents/" id="np-open-path">
      <div class="dialog-buttons">
        <button class="retro-btn" id="np-open-ok">Open</button>
        <button class="retro-btn" id="np-open-cancel">Cancel</button>
      </div>
    `;
    win.body.appendChild(dialog);
    const pathInput = dialog.querySelector('#np-open-path');
    pathInput.focus();

    dialog.querySelector('#np-open-ok').addEventListener('click', () => {
      const path = pathInput.value.trim();
      const content = VFS.readFile(path);
      if (content !== null) {
        textarea.value = content;
        currentPath = path;
        modified = false;
        win.el.querySelector('.win-title').textContent = path.split('/').pop() + ' - Notepad';
      } else {
        showMsgBox('Notepad', `Cannot open '${path}'`, '⚠️');
      }
      dialog.remove();
    });
    dialog.querySelector('#np-open-cancel').addEventListener('click', () => dialog.remove());
    pathInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') dialog.querySelector('#np-open-ok').click(); });
  }

  // Menu actions
  win.el.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('click', (e) => {
      const menu = item.dataset.menu;
      if (menu === 'file') {
        ContextMenu.show(item.getBoundingClientRect().left, item.getBoundingClientRect().bottom, [
          { label: 'New', action: () => { textarea.value = ''; currentPath = null; modified = false; win.el.querySelector('.win-title').textContent = 'Untitled - Notepad'; } },
          { label: 'Open...', action: openFile },
          { label: 'Save', action: saveFile },
          { label: 'Save As...', action: showSaveDialog },
          '---',
          { label: 'Exit', action: () => WM.close(win.id) },
        ]);
      } else if (menu === 'edit') {
        ContextMenu.show(item.getBoundingClientRect().left, item.getBoundingClientRect().bottom, [
          { label: 'Find & Replace...', action: showFindReplace },
          { label: 'Select All', action: () => textarea.select() },
          '---',
          { label: 'Date/Time', action: () => {
            const pos = textarea.selectionStart;
            const dt = new Date().toLocaleString();
            textarea.value = textarea.value.substring(0, pos) + dt + textarea.value.substring(pos);
          }},
        ]);
      } else if (menu === 'help') {
        showMsgBox('Notepad', 'RetroDesk Notepad v1.0\n\nShortcuts:\nCtrl+S: Save\nCtrl+H: Find & Replace\nCtrl+A: Select All', 'ℹ️');
      }
    });
  });

  // Word count function
  function getStats() {
    const text = textarea.value;
    const lines = text.split('\n').length;
    const words = text.split(/\s+/).filter(Boolean).length;
    const chars = text.length;
    return { lines, words, chars };
  }

  // Keyboard shortcuts
  textarea.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 's') { e.preventDefault(); saveFile(); }
      else if (e.key === 'h' || e.key === 'f') { e.preventDefault(); showFindReplace(); }
      else if (e.key === 'g') {
        e.preventDefault();
        // Go to line
        const lineNum = prompt('Go to line:');
        if (lineNum) {
          const lines = textarea.value.split('\n');
          const ln = Math.min(parseInt(lineNum), lines.length) - 1;
          if (ln >= 0) {
            let pos = 0;
            for (let i = 0; i < ln; i++) pos += lines[i].length + 1;
            textarea.setSelectionRange(pos, pos);
            textarea.focus();
          }
        }
      }
    }
    // Tab key inserts spaces
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      textarea.value = textarea.value.substring(0, start) + '    ' + textarea.value.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + 4;
      modified = true;
    }
  });

  // Word wrap toggle
  let wordWrap = true;
  function toggleWordWrap() {
    wordWrap = !wordWrap;
    textarea.style.whiteSpace = wordWrap ? 'pre-wrap' : 'pre';
    textarea.style.overflowX = wordWrap ? 'hidden' : 'auto';
  }

  // Enhanced menu: add Format and View menus
  // We already have File, Edit, Help. Let's hook them up better.
  win.el.querySelectorAll('.menu-item').forEach(item => {
    // Remove old listeners (they were already added above)
    // We'll override the help menu behavior with more info
  });
};

Apps.paint = function() {
  const existing = WM.findByApp('paint');
  if (existing) { WM.focus(existing.id); return; }

  const win = WM.createWindow({
    title: 'Paint', icon: '🎨', appType: 'paint',
    width: 640, height: 480, minWidth: 400, minHeight: 300,
    body: `
      <div style="display:flex;flex-direction:column;height:100%;">
        <div style="display:flex;flex:1;overflow:hidden;">
          <div class="paint-toolbar" id="paint-tools"></div>
          <div class="paint-canvas-wrap">
            <canvas class="paint-canvas" id="paint-canvas" width="560" height="380"></canvas>
          </div>
        </div>
        <div class="paint-colors" id="paint-colors"></div>
      </div>
    `,
    statusbar: 'Ready',
  });

  const canvas = win.body.querySelector('#paint-canvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  let tool = 'pen';
  let color = '#000000';
  let bgColor = '#ffffff';
  let lineWidth = 2;
  let drawing = false;
  let lastX = 0, lastY = 0;
  let startX = 0, startY = 0;
  let undoStack = [];
  let redoStack = [];
  let previewCanvas = null;

  function saveUndo() {
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (undoStack.length > 30) undoStack.shift();
    redoStack = [];
  }

  function undo() {
    if (undoStack.length === 0) return;
    redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(undoStack.pop(), 0, 0);
  }

  function redo() {
    if (redoStack.length === 0) return;
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(redoStack.pop(), 0, 0);
  }

  // Tool definitions
  const tools = [
    { id: 'pen', icon: '✏️', title: 'Pencil' },
    { id: 'line', icon: '📏', title: 'Line' },
    { id: 'rect', icon: '⬜', title: 'Rectangle' },
    { id: 'circle', icon: '⭕', title: 'Ellipse' },
    { id: 'fill', icon: '🪣', title: 'Fill' },
    { id: 'eraser', icon: '🧹', title: 'Eraser' },
    { id: 'picker', icon: '💉', title: 'Color Picker' },
    { id: 'undo', icon: '↩️', title: 'Undo' },
    { id: 'redo', icon: '↪️', title: 'Redo' },
    { id: 'clear', icon: '🗑️', title: 'Clear' },
  ];

  const toolsEl = win.body.querySelector('#paint-tools');
  tools.forEach(t => {
    const btn = document.createElement('div');
    btn.className = 'paint-tool-btn' + (t.id === tool ? ' active' : '');
    btn.title = t.title;
    btn.textContent = t.icon;
    btn.dataset.tool = t.id;
    btn.addEventListener('click', () => {
      if (t.id === 'undo') { undo(); return; }
      if (t.id === 'redo') { redo(); return; }
      if (t.id === 'clear') { saveUndo(); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); return; }
      tool = t.id;
      toolsEl.querySelectorAll('.paint-tool-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
    toolsEl.appendChild(btn);
  });

  // Size buttons
  [1, 2, 4, 8].forEach(size => {
    const btn = document.createElement('div');
    btn.className = 'paint-tool-btn' + (size === lineWidth ? ' active' : '');
    btn.style.fontSize = '10px';
    btn.textContent = size;
    btn.title = `Size ${size}`;
    btn.dataset.size = size;
    btn.addEventListener('click', () => {
      lineWidth = size;
      toolsEl.querySelectorAll('[data-size]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
    toolsEl.appendChild(btn);
  });

  // Color palette
  const COLORS = [
    '#000000','#808080','#800000','#808000','#008000','#008080','#000080','#800080',
    '#ffffff','#c0c0c0','#ff0000','#ffff00','#00ff00','#00ffff','#0000ff','#ff00ff',
    '#c08040','#ff8000','#80ff00','#00ff80','#0080ff','#8000ff','#ff0080','#ff80c0',
    '#804000','#404040','#400000','#404000','#004000','#004040','#000040','#400040',
  ];

  const colorsEl = win.body.querySelector('#paint-colors');
  const ccDiv = document.createElement('div');
  ccDiv.className = 'paint-current-colors';
  ccDiv.innerHTML = `<div class="paint-fg-color" style="background:${color}"></div><div class="paint-bg-color" style="background:${bgColor}"></div>`;
  colorsEl.appendChild(ccDiv);

  COLORS.forEach(c => {
    const cell = document.createElement('div');
    cell.className = 'paint-color-cell';
    cell.style.background = c;
    cell.addEventListener('click', () => {
      color = c;
      ccDiv.querySelector('.paint-fg-color').style.background = c;
    });
    cell.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      bgColor = c;
      ccDiv.querySelector('.paint-bg-color').style.background = c;
    });
    colorsEl.appendChild(cell);
  });

  // Canvas events
  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  function floodFill(sx, sy, fillColor) {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    const w = canvas.width, h = canvas.height;
    sx = Math.floor(sx); sy = Math.floor(sy);
    if (sx < 0 || sx >= w || sy < 0 || sy >= h) return;

    const targetIdx = (sy * w + sx) * 4;
    const targetR = data[targetIdx], targetG = data[targetIdx+1], targetB = data[targetIdx+2], targetA = data[targetIdx+3];

    // Parse fillColor
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = tempCanvas.height = 1;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.fillStyle = fillColor;
    tempCtx.fillRect(0, 0, 1, 1);
    const fData = tempCtx.getImageData(0, 0, 1, 1).data;
    const fillR = fData[0], fillG = fData[1], fillB = fData[2], fillA = fData[3];

    if (targetR === fillR && targetG === fillG && targetB === fillB && targetA === fillA) return;

    function match(idx) {
      return data[idx] === targetR && data[idx+1] === targetG && data[idx+2] === targetB && data[idx+3] === targetA;
    }

    const stack = [[sx, sy]];
    const visited = new Uint8Array(w * h);

    while (stack.length) {
      const [cx, cy] = stack.pop();
      const pixelIdx = cy * w + cx;
      if (cx < 0 || cx >= w || cy < 0 || cy >= h) continue;
      if (visited[pixelIdx]) continue;
      const dataIdx = pixelIdx * 4;
      if (!match(dataIdx)) continue;
      visited[pixelIdx] = 1;
      data[dataIdx] = fillR; data[dataIdx+1] = fillG; data[dataIdx+2] = fillB; data[dataIdx+3] = fillA;
      stack.push([cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1]);
    }

    ctx.putImageData(imageData, 0, 0);
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(e); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onMove(e); }, { passive: false });
  canvas.addEventListener('touchend', (e) => { onUp(e); });

  function onDown(e) {
    drawing = true;
    const pos = getCanvasPos(e);
    lastX = pos.x; lastY = pos.y;
    startX = pos.x; startY = pos.y;

    if (tool === 'fill') {
      saveUndo();
      floodFill(pos.x, pos.y, color);
      drawing = false;
      return;
    }
    if (tool === 'picker') {
      const pixel = ctx.getImageData(Math.floor(pos.x), Math.floor(pos.y), 1, 1).data;
      color = `rgb(${pixel[0]},${pixel[1]},${pixel[2]})`;
      ccDiv.querySelector('.paint-fg-color').style.background = color;
      drawing = false;
      return;
    }

    saveUndo();

    if (tool === 'pen' || tool === 'eraser') {
      ctx.beginPath();
      ctx.strokeStyle = tool === 'eraser' ? bgColor : color;
      ctx.lineWidth = tool === 'eraser' ? lineWidth * 4 : lineWidth;
      ctx.moveTo(pos.x, pos.y);
      ctx.lineTo(pos.x + 0.1, pos.y + 0.1);
      ctx.stroke();
    }

    if (tool === 'line' || tool === 'rect' || tool === 'circle') {
      previewCanvas = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }
  }

  function onMove(e) {
    if (!drawing) return;
    const pos = getCanvasPos(e);

    if (tool === 'pen' || tool === 'eraser') {
      ctx.beginPath();
      ctx.strokeStyle = tool === 'eraser' ? bgColor : color;
      ctx.lineWidth = tool === 'eraser' ? lineWidth * 4 : lineWidth;
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      lastX = pos.x; lastY = pos.y;
    }

    if (tool === 'line' || tool === 'rect' || tool === 'circle') {
      ctx.putImageData(previewCanvas, 0, 0);
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.beginPath();
      if (tool === 'line') {
        ctx.moveTo(startX, startY);
        ctx.lineTo(pos.x, pos.y);
      } else if (tool === 'rect') {
        ctx.rect(startX, startY, pos.x - startX, pos.y - startY);
      } else if (tool === 'circle') {
        const rx = Math.abs(pos.x - startX) / 2;
        const ry = Math.abs(pos.y - startY) / 2;
        const cx = (startX + pos.x) / 2;
        const cy = (startY + pos.y) / 2;
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      }
      ctx.stroke();
    }
  }

  function onUp(e) {
    drawing = false;
    previewCanvas = null;
    updateStatus(e);
  }

  function updateStatus(e) {
    if (e && (e.clientX || (e.touches && e.touches.length))) {
      const pos = getCanvasPos(e);
      win.el.querySelector('.window-statusbar').textContent = `${Math.round(pos.x)}, ${Math.round(pos.y)} | Tool: ${tool}`;
    }
  }

  canvas.addEventListener('mousemove', updateStatus);

  // Text tool implementation
  function addText(x, y) {
    const text = prompt('Enter text:');
    if (!text) return;
    saveUndo();
    ctx.fillStyle = color;
    ctx.font = `${lineWidth * 6 + 10}px ${getComputedStyle(document.body).getPropertyValue('--font-system')}`;
    ctx.fillText(text, x, y);
  }

  // Save canvas as data URL to VFS
  function saveCanvasToFile() {
    const dataUrl = canvas.toDataURL('image/png');
    const name = prompt('Save as:', 'painting.png');
    if (name) {
      VFS.writeFile('/home/Pictures/' + name, '[PNG Image Data - ' + dataUrl.length + ' bytes]');
      Notifications.show(`Saved to /home/Pictures/${name}`, '🎨');
    }
  }

  // Clear with confirmation
  function clearCanvas() {
    showMsgBox('Paint', 'Clear the entire canvas?', '🎨', ['Yes', 'No'], (btn) => {
      if (btn === 'Yes') {
        saveUndo();
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    });
  }

  // Resize canvas
  function resizeCanvas() {
    const w = parseInt(prompt('Width:', canvas.width));
    const h = parseInt(prompt('Height:', canvas.height));
    if (w > 0 && h > 0 && w <= 2000 && h <= 2000) {
      saveUndo();
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      canvas.width = w;
      canvas.height = h;
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, w, h);
      ctx.putImageData(imageData, 0, 0);
    }
  }

  // Invert colors
  function invertColors() {
    saveUndo();
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
      data[i] = 255 - data[i];
      data[i+1] = 255 - data[i+1];
      data[i+2] = 255 - data[i+2];
    }
    ctx.putImageData(imageData, 0, 0);
  }

  // Grayscale
  function grayscale() {
    saveUndo();
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
      const avg = (data[i] + data[i+1] + data[i+2]) / 3;
      data[i] = data[i+1] = data[i+2] = avg;
    }
    ctx.putImageData(imageData, 0, 0);
  }

  // Flip horizontal
  function flipH() {
    saveUndo();
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.putImageData(imageData, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(tempCanvas, -canvas.width, 0);
    ctx.restore();
  }

  // Flip vertical
  function flipV() {
    saveUndo();
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.putImageData(imageData, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(1, -1);
    ctx.drawImage(tempCanvas, 0, -canvas.height);
    ctx.restore();
  }

  // Add context menu to canvas
  canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    ContextMenu.show(e.clientX, e.clientY, [
      { label: 'Undo', action: undo },
      { label: 'Redo', action: redo },
      '---',
      { label: 'Clear Canvas', action: clearCanvas },
      { label: 'Invert Colors', action: invertColors },
      { label: 'Grayscale', action: grayscale },
      '---',
      { label: 'Flip Horizontal', action: flipH },
      { label: 'Flip Vertical', action: flipV },
      '---',
      { label: 'Canvas Size...', action: resizeCanvas },
      { label: 'Save to File...', action: saveCanvasToFile },
    ]);
  });

  // Keyboard shortcuts
  win.el.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); redo(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveCanvasToFile(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'i') { e.preventDefault(); invertColors(); }
    // Tool hotkeys
    if (!e.ctrlKey && !e.metaKey) {
      const hotkeys = { 'b': 'pen', 'l': 'line', 'r': 'rect', 'o': 'circle', 'g': 'fill', 'e': 'eraser', 'i': 'picker' };
      if (hotkeys[e.key]) {
        tool = hotkeys[e.key];
        toolsEl.querySelectorAll('.paint-tool-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = toolsEl.querySelector(`[data-tool="${tool}"]`);
        if (activeBtn) activeBtn.classList.add('active');
      }
      // Size hotkeys 1-4
      if (e.key >= '1' && e.key <= '4') {
        const sizes = [1, 2, 4, 8];
        const idx = parseInt(e.key) - 1;
        lineWidth = sizes[idx];
        toolsEl.querySelectorAll('[data-size]').forEach(b => b.classList.remove('active'));
        const sizeBtn = toolsEl.querySelector(`[data-size="${lineWidth}"]`);
        if (sizeBtn) sizeBtn.classList.add('active');
      }
    }
  });

  // Make paint window focusable
  win.el.tabIndex = 0;
};

// ==========================================
// APP: CALCULATOR
// ==========================================
Apps.calculator = function() {
  const existing = WM.findByApp('calculator');
  if (existing) { WM.focus(existing.id); return; }

  const win = WM.createWindow({
    title: 'Calculator', icon: '🔢', appType: 'calculator',
    width: 280, height: 380, minWidth: 220, minHeight: 300,
    body: `
      <div style="display:flex;flex-direction:column;height:100%;padding:2px;">
        <div class="calc-history-display" id="calc-hist"></div>
        <div class="calc-display" id="calc-display">0</div>
        <div style="display:flex;gap:4px;padding:4px 4px 0;">
          <button class="retro-btn" id="calc-mode-std" style="flex:1;font-size:10px;">Standard</button>
          <button class="retro-btn" id="calc-mode-sci" style="flex:1;font-size:10px;">Scientific</button>
        </div>
        <div class="calc-buttons" id="calc-buttons" style="grid-template-columns:repeat(4,1fr);"></div>
        <div class="calc-buttons" id="calc-sci-buttons" style="grid-template-columns:repeat(4,1fr);display:none;"></div>
      </div>
    `,
  });

  const display = win.body.querySelector('#calc-display');
  const histDisplay = win.body.querySelector('#calc-hist');
  const stdBtns = win.body.querySelector('#calc-buttons');
  const sciBtns = win.body.querySelector('#calc-sci-buttons');

  let current = '0';
  let previous = '';
  let operator = '';
  let resetNext = false;
  let history = '';
  let memory = 0;
  let isScientific = false;

  // Easter egg: type 80085 for a surprise
  let eggSequence = '';

  function updateDisplay() {
    display.textContent = current;
    histDisplay.textContent = history;
  }

  function inputDigit(d) {
    // Easter egg tracking
    eggSequence += d;
    if (eggSequence.includes('80085') || eggSequence.includes('58008')) {
      showMsgBox('🥚 Calculator', 'hehe, classic calculator trick! 😄', '🔢');
      eggSequence = '';
    }
    if (eggSequence.length > 10) eggSequence = eggSequence.slice(-5);

    if (resetNext) { current = d; resetNext = false; }
    else if (current === '0' && d !== '.') { current = d; }
    else if (d === '.' && current.includes('.')) { return; }
    else { current += d; }
    updateDisplay();
  }

  function inputOperator(op) {
    if (operator && !resetNext) calculate();
    previous = current;
    operator = op;
    history = `${previous} ${op}`;
    resetNext = true;
    updateDisplay();
  }

  function calculate() {
    if (!operator || resetNext) return;
    const a = parseFloat(previous);
    const b = parseFloat(current);
    let result;
    switch (operator) {
      case '+': result = a + b; break;
      case '-': result = a - b; break;
      case '×': result = a * b; break;
      case '÷': result = b === 0 ? 'Error' : a / b; break;
      case '^': result = Math.pow(a, b); break;
      default: result = b;
    }
    history = `${previous} ${operator} ${current} =`;
    current = result === 'Error' ? 'Error' : String(parseFloat(result.toFixed(10)));
    operator = '';
    previous = '';
    resetNext = true;
    updateDisplay();
    SoundEngine.play('click');
  }

  function clear() { current = '0'; previous = ''; operator = ''; history = ''; resetNext = false; eggSequence = ''; updateDisplay(); }
  function clearEntry() { current = '0'; updateDisplay(); }
  function backspace() { current = current.length > 1 ? current.slice(0, -1) : '0'; updateDisplay(); }
  function toggleSign() { current = String(-parseFloat(current)); updateDisplay(); }
  function percent() { current = String(parseFloat(current) / 100); updateDisplay(); }

  function sciFunc(fn) {
    const val = parseFloat(current);
    let result;
    switch(fn) {
      case 'sin': result = Math.sin(val * Math.PI / 180); break;
      case 'cos': result = Math.cos(val * Math.PI / 180); break;
      case 'tan': result = Math.tan(val * Math.PI / 180); break;
      case 'asin': result = Math.asin(val) * 180 / Math.PI; break;
      case 'acos': result = Math.acos(val) * 180 / Math.PI; break;
      case 'atan': result = Math.atan(val) * 180 / Math.PI; break;
      case 'sqrt': result = Math.sqrt(val); break;
      case 'cbrt': result = Math.cbrt(val); break;
      case 'log': result = Math.log10(val); break;
      case 'ln': result = Math.log(val); break;
      case 'x²': result = val * val; break;
      case 'x³': result = val * val * val; break;
      case '1/x': result = val === 0 ? 'Error' : 1 / val; break;
      case 'π': result = Math.PI; break;
      case 'e': result = Math.E; break;
      case 'n!': result = factorial(Math.round(val)); break;
      case 'abs': result = Math.abs(val); break;
      case 'exp': result = Math.exp(val); break;
      case '10^x': result = Math.pow(10, val); break;
      default: result = val;
    }
    history = `${fn}(${current})`;
    current = result === 'Error' ? 'Error' : String(parseFloat(Number(result).toFixed(10)));
    resetNext = true;
    updateDisplay();
  }

  function factorial(n) {
    if (n < 0) return NaN;
    if (n <= 1) return 1;
    if (n > 170) return Infinity;
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  }

  // Standard buttons
  const STD_BTNS = [
    { label: 'MC', action: () => { memory = 0; }, cls: 'red' },
    { label: 'MR', action: () => { current = String(memory); updateDisplay(); }, cls: 'red' },
    { label: 'M+', action: () => { memory += parseFloat(current); }, cls: 'red' },
    { label: 'M-', action: () => { memory -= parseFloat(current); }, cls: 'red' },
    { label: 'C', action: clear, cls: 'red' },
    { label: 'CE', action: clearEntry, cls: 'red' },
    { label: '⌫', action: backspace, cls: 'red' },
    { label: '÷', action: () => inputOperator('÷'), cls: 'op' },
    { label: '7', action: () => inputDigit('7') },
    { label: '8', action: () => inputDigit('8') },
    { label: '9', action: () => inputDigit('9') },
    { label: '×', action: () => inputOperator('×'), cls: 'op' },
    { label: '4', action: () => inputDigit('4') },
    { label: '5', action: () => inputDigit('5') },
    { label: '6', action: () => inputDigit('6') },
    { label: '-', action: () => inputOperator('-'), cls: 'op' },
    { label: '1', action: () => inputDigit('1') },
    { label: '2', action: () => inputDigit('2') },
    { label: '3', action: () => inputDigit('3') },
    { label: '+', action: () => inputOperator('+'), cls: 'op' },
    { label: '±', action: toggleSign },
    { label: '0', action: () => inputDigit('0') },
    { label: '.', action: () => inputDigit('.') },
    { label: '=', action: calculate, cls: 'eq' },
  ];

  STD_BTNS.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'calc-btn' + (b.cls ? ' ' + b.cls : '');
    btn.textContent = b.label;
    btn.addEventListener('click', b.action);
    stdBtns.appendChild(btn);
  });

  // Scientific buttons
  const SCI_BTNS = [
    { label: 'sin', fn: 'sin' }, { label: 'cos', fn: 'cos' }, { label: 'tan', fn: 'tan' }, { label: 'π', fn: 'π' },
    { label: 'asin', fn: 'asin' }, { label: 'acos', fn: 'acos' }, { label: 'atan', fn: 'atan' }, { label: 'e', fn: 'e' },
    { label: 'x²', fn: 'x²' }, { label: 'x³', fn: 'x³' }, { label: '√', fn: 'sqrt' }, { label: '∛', fn: 'cbrt' },
    { label: 'log', fn: 'log' }, { label: 'ln', fn: 'ln' }, { label: '10^x', fn: '10^x' }, { label: 'exp', fn: 'exp' },
    { label: '1/x', fn: '1/x' }, { label: 'n!', fn: 'n!' }, { label: '|x|', fn: 'abs' }, { label: 'x^y', action: () => inputOperator('^') },
  ];

  SCI_BTNS.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'calc-btn op';
    btn.textContent = b.label;
    btn.style.fontSize = '11px';
    btn.addEventListener('click', b.action || (() => sciFunc(b.fn)));
    sciBtns.appendChild(btn);
  });

  // Mode switching
  win.body.querySelector('#calc-mode-std').addEventListener('click', () => {
    isScientific = false;
    sciBtns.style.display = 'none';
    stdBtns.style.gridTemplateColumns = 'repeat(4, 1fr)';
  });
  win.body.querySelector('#calc-mode-sci').addEventListener('click', () => {
    isScientific = true;
    sciBtns.style.display = 'grid';
    sciBtns.style.gridTemplateColumns = 'repeat(4, 1fr)';
  });

  // Keyboard input
  win.el.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
    else if (e.key === '.') inputDigit('.');
    else if (e.key === '+') inputOperator('+');
    else if (e.key === '-') inputOperator('-');
    else if (e.key === '*') inputOperator('×');
    else if (e.key === '/') { e.preventDefault(); inputOperator('÷'); }
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Escape') clear();
    else if (e.key === 'Backspace') backspace();
    else if (e.key === '%') percent();
  });

  // Make focusable for keyboard
  win.el.tabIndex = 0;
  win.el.focus();
};

// ==========================================
// APP: FILE MANAGER
// ==========================================
Apps.fileManager = function(startPath) {
  const win = WM.createWindow({
    title: 'File Manager', icon: '📁', appType: 'filemanager',
    width: 500, height: 380, minWidth: 350, minHeight: 250,
    body: `
      <div style="display:flex;flex-direction:column;height:100%;">
        <div class="fm-toolbar">
          <button class="retro-btn" id="fm-back" style="min-width:30px;padding:2px 6px;" title="Up">⬆️</button>
          <button class="retro-btn" id="fm-refresh" style="min-width:30px;padding:2px 6px;" title="Refresh">🔄</button>
          <div class="fm-path" id="fm-path">/home</div>
          <button class="retro-btn" id="fm-view-icon" style="min-width:30px;padding:2px 6px;" title="Icon view">🔲</button>
          <button class="retro-btn" id="fm-view-list" style="min-width:30px;padding:2px 6px;" title="List view">📋</button>
        </div>
        <div class="fm-content" id="fm-content"></div>
      </div>
    `,
    statusbar: '0 items',
  });

  let currentPath = startPath || '/home';
  let viewMode = 'icon';
  let selectedItem = null;

  const ICON_MAP = {
    'dir': '📁',
    'txt': '📄', 'dat': '📊', 'sys': '⚙️', 'bat': '🖥️',
    'default': '📄',
  };

  function getIcon(name, type) {
    if (type === 'dir') return ICON_MAP.dir;
    const ext = name.split('.').pop().toLowerCase();
    return ICON_MAP[ext] || ICON_MAP.default;
  }

  function navigate(path) {
    currentPath = path;
    win.body.querySelector('#fm-path').textContent = path;
    render();
  }

  function render() {
    const content = win.body.querySelector('#fm-content');
    const children = VFS.ls(currentPath);
    if (!children) { content.innerHTML = '<div style="padding:10px;">Cannot open directory</div>'; return; }

    const items = children.map(name => {
      const fullPath = currentPath === '/' ? '/' + name : currentPath + '/' + name;
      const type = VFS.getType(fullPath);
      return { name, fullPath, type, icon: getIcon(name, type) };
    });

    content.innerHTML = '';
    content.className = 'fm-content ' + (viewMode === 'list' ? 'fm-list-view' : 'fm-icon-view');

    if (viewMode === 'list') {
      const header = document.createElement('div');
      header.className = 'fm-list-header';
      header.innerHTML = '<span style="width:30px;"></span><span style="flex:1;">Name</span><span style="width:80px;">Type</span>';
      content.appendChild(header);
    }

    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'fm-item';
      el.innerHTML = `<span class="fm-item-icon">${item.icon}</span><span class="fm-item-name">${item.name}</span>`;
      if (viewMode === 'list') {
        el.innerHTML += `<span style="width:80px;font-size:11px;">${item.type === 'dir' ? 'Folder' : 'File'}</span>`;
      }

      el.addEventListener('click', (e) => {
        e.stopPropagation();
        if (selectedItem) selectedItem.classList.remove('selected');
        el.classList.add('selected');
        selectedItem = el;
        SoundEngine.play('click');
      });

      el.addEventListener('dblclick', () => {
        if (item.type === 'dir') {
          navigate(item.fullPath);
        } else {
          const content = VFS.readFile(item.fullPath);
          if (content !== null) Apps.notepad(item.fullPath, content);
        }
      });

      // Touch double-tap
      let lastTap = 0;
      el.addEventListener('touchend', () => {
        const now = Date.now();
        if (now - lastTap < 350) {
          if (item.type === 'dir') navigate(item.fullPath);
          else {
            const content = VFS.readFile(item.fullPath);
            if (content !== null) Apps.notepad(item.fullPath, content);
          }
        }
        lastTap = now;
      });

      el.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        ContextMenu.show(e.clientX, e.clientY, [
          { label: 'Open', action: () => {
            if (item.type === 'dir') navigate(item.fullPath);
            else { const c = VFS.readFile(item.fullPath); if (c !== null) Apps.notepad(item.fullPath, c); }
          }},
          '---',
          { label: 'Delete', action: () => {
            VFS.deleteNode(item.fullPath);
            render();
          }},
        ]);
      });

      content.appendChild(el);
    });

    win.el.querySelector('.window-statusbar').textContent = `${items.length} item(s)`;
  }

  // Toolbar events
  win.body.querySelector('#fm-back').addEventListener('click', () => {
    if (currentPath === '/') return;
    const parts = currentPath.split('/');
    parts.pop();
    navigate(parts.join('/') || '/');
  });
  win.body.querySelector('#fm-refresh').addEventListener('click', render);
  win.body.querySelector('#fm-view-icon').addEventListener('click', () => { viewMode = 'icon'; render(); });
  win.body.querySelector('#fm-view-list').addEventListener('click', () => { viewMode = 'list'; render(); });

  // Context menu on empty area
  win.body.querySelector('#fm-content').addEventListener('contextmenu', (e) => {
    if (e.target.closest('.fm-item')) return;
    e.preventDefault();
    ContextMenu.show(e.clientX, e.clientY, [
      { label: 'New Folder', action: () => {
        const name = prompt('Folder name:', 'New Folder');
        if (name) {
          const path = currentPath === '/' ? '/' + name : currentPath + '/' + name;
          VFS.mkdir(path);
          render();
        }
      }},
      { label: 'New Text File', action: () => {
        const name = prompt('File name:', 'untitled.txt');
        if (name) {
          const path = currentPath === '/' ? '/' + name : currentPath + '/' + name;
          VFS.writeFile(path, '');
          render();
        }
      }},
      '---',
      { label: 'Refresh', action: render },
      { label: 'Properties', action: () => {
        const children = VFS.ls(currentPath) || [];
        const files = children.filter(c => {
          const fp = currentPath === '/' ? '/' + c : currentPath + '/' + c;
          return !VFS.isDir(fp);
        }).length;
        const dirs = children.length - files;
        showMsgBox('Properties', `Path: ${currentPath}\nContains: ${dirs} folder(s), ${files} file(s)`, '📁');
      }},
    ]);
  });

  // Keyboard navigation
  win.el.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace') {
      e.preventDefault();
      if (currentPath !== '/') {
        const parts = currentPath.split('/');
        parts.pop();
        navigate(parts.join('/') || '/');
      }
    }
    if (e.key === 'F5') { e.preventDefault(); render(); }
  });

  // Address bar navigation
  const pathEl = win.body.querySelector('#fm-path');
  pathEl.addEventListener('dblclick', () => {
    const input = document.createElement('input');
    input.type = 'text';
    input.value = currentPath;
    input.className = 'retro-input';
    input.style.cssText = 'width:100%;font-size:11px;';
    pathEl.replaceWith(input);
    input.focus();
    input.select();
    const finishEdit = () => {
      const val = input.value.trim();
      const newPathEl = document.createElement('div');
      newPathEl.className = 'fm-path';
      newPathEl.id = 'fm-path';
      newPathEl.textContent = currentPath;
      input.replaceWith(newPathEl);
      if (VFS.isDir(val)) navigate(val);
      // Re-attach dblclick handler
      newPathEl.addEventListener('dblclick', () => {
        // simplified: just navigate to typed path
        const p = prompt('Go to path:', currentPath);
        if (p && VFS.isDir(p)) navigate(p);
      });
    };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') finishEdit(); if (e.key === 'Escape') finishEdit(); });
    input.addEventListener('blur', finishEdit);
  });

  navigate(currentPath);
};

// ==========================================
// APP: SNAKE
// ==========================================
Apps.snake = function() {
  const existing = WM.findByApp('snake');
  if (existing) { WM.focus(existing.id); return; }

  const CELL = 16;
  const COLS = 24;
  const ROWS = 20;
  const W = COLS * CELL;
  const H = ROWS * CELL;

  const win = WM.createWindow({
    title: 'Snake', icon: '🐍', appType: 'snake',
    width: W + 20, height: H + 80, minWidth: W + 20, minHeight: H + 80,
    body: `
      <div style="text-align:center;padding:4px;">
        <div style="display:flex;justify-content:space-between;padding:2px 8px;font-size:12px;">
          <span>Score: <b id="snake-score">0</b></span>
          <span>High: <b id="snake-high">0</b></span>
          <span>Speed: <b id="snake-speed">1</b></span>
        </div>
        <div style="position:relative;display:inline-block;">
          <canvas class="snake-canvas" id="snake-canvas" width="${W}" height="${H}"></canvas>
          <div class="game-overlay" id="snake-overlay">
            <div>🐍 SNAKE</div>
            <div style="font-size:13px;">Arrow keys or swipe to move</div>
            <button class="retro-btn" id="snake-start">Start Game</button>
          </div>
        </div>
      </div>
    `,
  });

  const canvas = win.body.querySelector('#snake-canvas');
  const ctx = canvas.getContext('2d');
  const overlay = win.body.querySelector('#snake-overlay');
  const scoreEl = win.body.querySelector('#snake-score');
  const highEl = win.body.querySelector('#snake-high');
  const speedEl = win.body.querySelector('#snake-speed');

  let snake, dir, nextDir, food, score, highScore, speed, gameInterval, running;

  // Load high score
  const scoresData = VFS.readFile('/programs/games/scores.dat') || '';
  const hsMatch = scoresData.match(/SNAKE_HIGH=(\d+)/);
  highScore = hsMatch ? parseInt(hsMatch[1]) : 0;
  highEl.textContent = highScore;

  function init() {
    snake = [{ x: 12, y: 10 }, { x: 11, y: 10 }, { x: 10, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = 1;
    scoreEl.textContent = '0';
    speedEl.textContent = '1';
    placeFood();
    overlay.style.display = 'none';
    running = true;
    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(tick, 120);
  }

  function placeFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function tick() {
    if (!running) return;
    dir = { ...nextDir };
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { gameOver(); return; }
    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      SoundEngine.play('snake_eat');
      placeFood();
      // Speed up every 50 points
      if (score % 50 === 0 && speed < 10) {
        speed++;
        speedEl.textContent = speed;
        clearInterval(gameInterval);
        gameInterval = setInterval(tick, Math.max(40, 120 - speed * 8));
      }
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    // Background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    // Grid lines (subtle)
    ctx.strokeStyle = '#1e1e36';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= W; x += CELL) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += CELL) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // Snake
    snake.forEach((s, i) => {
      const brightness = Math.max(100, 255 - i * 5);
      ctx.fillStyle = i === 0 ? '#00ff00' : `rgb(0,${brightness},0)`;
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
      if (i === 0) {
        // Eyes
        ctx.fillStyle = '#000';
        const ex = dir.x === 0 ? 3 : (dir.x > 0 ? 9 : 3);
        const ey = dir.y === 0 ? 3 : (dir.y > 0 ? 9 : 3);
        ctx.fillRect(s.x * CELL + ex, s.y * CELL + ey, 2, 2);
        ctx.fillRect(s.x * CELL + ex + (dir.y !== 0 ? 6 : 0), s.y * CELL + ey + (dir.x !== 0 ? 6 : 0), 2, 2);
      }
    });

    // Food
    ctx.fillStyle = '#ff3366';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
    ctx.fill();
    // Apple stem
    ctx.fillStyle = '#4a2';
    ctx.fillRect(food.x * CELL + CELL / 2 - 1, food.y * CELL + 1, 2, 3);
  }

  function gameOver() {
    running = false;
    clearInterval(gameInterval);
    SoundEngine.play('snake_die');

    if (score > highScore) {
      highScore = score;
      highEl.textContent = highScore;
      // Save to VFS
      let data = VFS.readFile('/programs/games/scores.dat') || '';
      data = data.replace(/SNAKE_HIGH=\d+/, `SNAKE_HIGH=${highScore}`);
      VFS.writeFile('/programs/games/scores.dat', data);
    }

    overlay.innerHTML = `
      <div>💀 Game Over!</div>
      <div style="font-size:14px;">Score: ${score}</div>
      ${score === highScore && score > 0 ? '<div style="color:#ff0;font-size:13px;">🏆 New High Score!</div>' : ''}
      <button class="retro-btn" id="snake-restart">Play Again</button>
    `;
    overlay.style.display = 'flex';
    overlay.querySelector('#snake-restart').addEventListener('click', init);
  }

  let paused = false;

  function togglePause() {
    if (!running && !paused) return;
    paused = !paused;
    if (paused) {
      clearInterval(gameInterval);
      // Show pause overlay
      const pauseOverlay = document.createElement('div');
      pauseOverlay.className = 'game-overlay';
      pauseOverlay.id = 'snake-pause-overlay';
      pauseOverlay.style.background = 'rgba(0,0,0,0.5)';
      pauseOverlay.innerHTML = '<div>⏸️ PAUSED</div><div style="font-size:12px;">Press P or Space to resume</div>';
      canvas.parentElement.appendChild(pauseOverlay);
    } else {
      const po = canvas.parentElement.querySelector('#snake-pause-overlay');
      if (po) po.remove();
      gameInterval = setInterval(tick, Math.max(40, 120 - speed * 8));
    }
  }

  // Controls
  document.addEventListener('keydown', function snakeKeys(e) {
    const wd = WM.windows.find(w => w.appType === 'snake');
    if (!wd || wd.id !== WM.activeWindowId) return;

    if (e.key === 'p' || e.key === 'P' || (e.key === ' ' && running)) {
      e.preventDefault();
      togglePause();
      return;
    }

    if (!running || paused) return;
    switch (e.key) {
      case 'ArrowUp':    case 'w': case 'W': e.preventDefault(); if (dir.y !== 1) nextDir = { x: 0, y: -1 }; break;
      case 'ArrowDown':  case 's': case 'S': e.preventDefault(); if (dir.y !== -1) nextDir = { x: 0, y: 1 }; break;
      case 'ArrowLeft':  case 'a': case 'A': e.preventDefault(); if (dir.x !== 1) nextDir = { x: -1, y: 0 }; break;
      case 'ArrowRight': case 'd': case 'D': e.preventDefault(); if (dir.x !== -1) nextDir = { x: 1, y: 0 }; break;
    }
  });

  // Touch swipe support
  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    if (!running) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 20 && dir.x !== -1) nextDir = { x: 1, y: 0 };
      else if (dx < -20 && dir.x !== 1) nextDir = { x: -1, y: 0 };
    } else {
      if (dy > 20 && dir.y !== -1) nextDir = { x: 0, y: 1 };
      else if (dy < -20 && dir.y !== 1) nextDir = { x: 0, y: -1 };
    }
  });

  win.data.onClose = () => { running = false; clearInterval(gameInterval); };
  win.body.querySelector('#snake-start').addEventListener('click', init);
  draw();
};

// ==========================================
// APP: MINESWEEPER
// ==========================================
Apps.minesweeper = function() {
  const existing = WM.findByApp('minesweeper');
  if (existing) { WM.focus(existing.id); return; }

  const DIFFICULTIES = {
    easy: { cols: 9, rows: 9, mines: 10 },
    medium: { cols: 16, rows: 16, mines: 40 },
    hard: { cols: 30, rows: 16, mines: 99 },
  };

  let difficulty = 'easy';
  let { cols, rows, mines } = DIFFICULTIES[difficulty];
  let board, revealed, flagged, gameStarted, gameOver, mineCount, timer, timerVal, firstClick;

  const win = WM.createWindow({
    title: 'Minesweeper', icon: '💣', appType: 'minesweeper',
    width: 300, height: 400, minWidth: 250, minHeight: 300,
    body: `
      <div style="text-align:center;padding:4px;">
        <div class="ms-difficulty" id="ms-diff">
          <button class="retro-btn" data-diff="easy">Easy</button>
          <button class="retro-btn" data-diff="medium">Medium</button>
          <button class="retro-btn" data-diff="hard">Hard</button>
        </div>
        <div class="ms-header">
          <div class="ms-counter" id="ms-mines">010</div>
          <button class="ms-face-btn" id="ms-face">😀</button>
          <div class="ms-counter" id="ms-timer">000</div>
        </div>
        <div id="ms-board-container" style="overflow:auto;max-height:calc(100% - 80px);display:inline-block;"></div>
      </div>
    `,
  });

  const boardContainer = win.body.querySelector('#ms-board-container');
  const minesDisplay = win.body.querySelector('#ms-mines');
  const timerDisplay = win.body.querySelector('#ms-timer');
  const faceBtn = win.body.querySelector('#ms-face');

  function initGame() {
    ({ cols, rows, mines } = DIFFICULTIES[difficulty]);
    board = Array(rows).fill(null).map(() => Array(cols).fill(0));
    revealed = Array(rows).fill(null).map(() => Array(cols).fill(false));
    flagged = Array(rows).fill(null).map(() => Array(cols).fill(false));
    gameStarted = false;
    gameOver = false;
    mineCount = mines;
    timerVal = 0;
    firstClick = true;
    if (timer) clearInterval(timer);
    minesDisplay.textContent = String(mines).padStart(3, '0');
    timerDisplay.textContent = '000';
    faceBtn.textContent = '😀';

    // Resize window for larger boards
    if (difficulty === 'hard') {
      win.el.style.width = (cols * 24 + 40) + 'px';
    } else if (difficulty === 'medium') {
      win.el.style.width = (cols * 24 + 40) + 'px';
    } else {
      win.el.style.width = '300px';
    }

    renderBoard();
  }

  function placeMines(safeR, safeC) {
    let placed = 0;
    while (placed < mines) {
      const r = Math.floor(Math.random() * rows);
      const c = Math.floor(Math.random() * cols);
      if (board[r][c] === -1) continue;
      if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
      board[r][c] = -1;
      placed++;
    }
    // Calculate numbers
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (board[r][c] === -1) continue;
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc] === -1) count++;
          }
        }
        board[r][c] = count;
      }
    }
  }

  function renderBoard() {
    boardContainer.innerHTML = '';
    const boardEl = document.createElement('div');
    boardEl.className = 'ms-board';
    boardEl.style.gridTemplateColumns = `repeat(${cols}, 24px)`;
    boardEl.style.gridTemplateRows = `repeat(${rows}, 24px)`;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement('div');
        cell.className = 'ms-cell';
        cell.dataset.r = r;
        cell.dataset.c = c;

        cell.addEventListener('mousedown', (e) => {
          if (e.button === 0) faceBtn.textContent = '😮';
        });
        cell.addEventListener('mouseup', (e) => {
          if (gameOver) return;
          if (e.button === 0) {
            faceBtn.textContent = '😀';
            handleClick(r, c);
          }
        });
        cell.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          if (gameOver) return;
          handleFlag(r, c);
        });

        // Touch support
        let longPressTimer = null;
        let didLongPress = false;
        cell.addEventListener('touchstart', (e) => {
          e.preventDefault();
          didLongPress = false;
          longPressTimer = setTimeout(() => {
            didLongPress = true;
            handleFlag(r, c);
          }, 500);
        }, { passive: false });
        cell.addEventListener('touchend', (e) => {
          e.preventDefault();
          clearTimeout(longPressTimer);
          if (!didLongPress && !gameOver) handleClick(r, c);
        });

        updateCell(cell, r, c);
        boardEl.appendChild(cell);
      }
    }
    boardContainer.appendChild(boardEl);
  }

  function updateCell(cell, r, c) {
    cell.className = 'ms-cell';
    cell.innerHTML = '';
    if (revealed[r][c]) {
      cell.classList.add('revealed');
      if (board[r][c] === -1) {
        cell.classList.add('mine');
        cell.textContent = '💣';
      } else if (board[r][c] > 0) {
        const span = document.createElement('span');
        span.className = 'n' + board[r][c];
        span.textContent = board[r][c];
        cell.appendChild(span);
      }
    } else if (flagged[r][c]) {
      cell.textContent = '🚩';
    }
  }

  function handleClick(r, c) {
    if (flagged[r][c] || revealed[r][c]) return;

    if (firstClick) {
      firstClick = false;
      placeMines(r, c);
      gameStarted = true;
      timer = setInterval(() => {
        timerVal++;
        timerDisplay.textContent = String(Math.min(timerVal, 999)).padStart(3, '0');
      }, 1000);
    }

    if (board[r][c] === -1) {
      // Hit mine
      revealAll();
      gameOver = true;
      clearInterval(timer);
      faceBtn.textContent = '😵';
      SoundEngine.play('mine_explode');
      revealed[r][c] = true;
      refreshAllCells();
      return;
    }

    reveal(r, c);
    refreshAllCells();
    checkWin();
  }

  function reveal(r, c) {
    if (r < 0 || r >= rows || c < 0 || c >= cols) return;
    if (revealed[r][c] || flagged[r][c]) return;
    revealed[r][c] = true;
    if (board[r][c] === 0) {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          reveal(r + dr, c + dc);
        }
      }
    }
  }

  function handleFlag(r, c) {
    if (revealed[r][c]) return;
    flagged[r][c] = !flagged[r][c];
    mineCount += flagged[r][c] ? -1 : 1;
    minesDisplay.textContent = String(Math.max(0, mineCount)).padStart(3, '0');
    SoundEngine.play('mine_flag');
    refreshAllCells();
  }

  function revealAll() {
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        if (board[r][c] === -1) revealed[r][c] = true;
  }

  function refreshAllCells() {
    const cells = boardContainer.querySelectorAll('.ms-cell');
    cells.forEach(cell => {
      updateCell(cell, parseInt(cell.dataset.r), parseInt(cell.dataset.c));
    });
  }

  function checkWin() {
    let unrevealed = 0;
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        if (!revealed[r][c]) unrevealed++;

    if (unrevealed === mines) {
      gameOver = true;
      clearInterval(timer);
      faceBtn.textContent = '😎';
      SoundEngine.play('win');
      showMsgBox('Minesweeper', `🎉 You won!\nTime: ${timerVal} seconds\nDifficulty: ${difficulty}`, '🏆');
    }
  }

  // Difficulty buttons
  win.body.querySelectorAll('[data-diff]').forEach(btn => {
    btn.addEventListener('click', () => {
      difficulty = btn.dataset.diff;
      initGame();
    });
  });

  faceBtn.addEventListener('click', initGame);
  win.data.onClose = () => { clearInterval(timer); };

  // Chord clicking (click revealed number with correct flags around it to reveal neighbors)
  function handleChord(r, c) {
    if (!revealed[r][c] || board[r][c] <= 0) return;
    let flagCount = 0;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && flagged[nr][nc]) flagCount++;
      }
    }
    if (flagCount === board[r][c]) {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !flagged[nr][nc] && !revealed[nr][nc]) {
            if (board[nr][nc] === -1) {
              revealAll();
              gameOver = true;
              clearInterval(timer);
              faceBtn.textContent = '😵';
              SoundEngine.play('mine_explode');
              revealed[nr][nc] = true;
              refreshAllCells();
              return;
            }
            reveal(nr, nc);
          }
        }
      }
      refreshAllCells();
      checkWin();
    }
  }

  // Middle click or double click for chord
  boardContainer.addEventListener('dblclick', (e) => {
    const cell = e.target.closest('.ms-cell');
    if (!cell || gameOver) return;
    handleChord(parseInt(cell.dataset.r), parseInt(cell.dataset.c));
  });

  // Keyboard shortcuts
  win.el.addEventListener('keydown', (e) => {
    if (e.key === 'F2') { e.preventDefault(); initGame(); }
  });

  initGame();
};

// ==========================================
// APP: MUSIC VISUALIZER
// ==========================================
Apps.musicVisualizer = function() {
  const existing = WM.findByApp('musicviz');
  if (existing) { WM.focus(existing.id); return; }

  const win = WM.createWindow({
    title: 'Music Visualizer', icon: '🎵', appType: 'musicviz',
    width: 500, height: 380, minWidth: 350, minHeight: 280,
    body: `
      <div style="position:relative;width:100%;height:100%;background:#000;">
        <canvas class="viz-canvas" id="viz-canvas"></canvas>
        <div class="viz-controls">
          <button id="viz-play">▶ Play</button>
          <select id="viz-wave">
            <option value="sine">Sine</option>
            <option value="square">Square</option>
            <option value="sawtooth">Sawtooth</option>
            <option value="triangle">Triangle</option>
          </select>
          <label>Freq:</label>
          <input type="range" id="viz-freq" min="60" max="2000" value="220" style="width:80px;">
          <select id="viz-mode">
            <option value="bars">Bars</option>
            <option value="waveform">Waveform</option>
            <option value="circular">Circular</option>
          </select>
          <label>Vol:</label>
          <input type="range" id="viz-vol" min="0" max="100" value="30" style="width:60px;">
        </div>
      </div>
    `,
  });

  const canvas = win.body.querySelector('#viz-canvas');
  const ctxC = canvas.getContext('2d');
  let audioCtx, oscillator, gainNode, analyser, dataArray, animFrame, playing = false;

  function setupAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0.3;
    gainNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height - 36;
  }

  function startPlayback() {
    if (!audioCtx) setupAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    oscillator = audioCtx.createOscillator();
    oscillator.type = win.body.querySelector('#viz-wave').value;
    oscillator.frequency.value = parseInt(win.body.querySelector('#viz-freq').value);
    oscillator.connect(gainNode);
    oscillator.start();
    playing = true;
    win.body.querySelector('#viz-play').textContent = '⏹ Stop';
    animate();
  }

  function stopPlayback() {
    if (oscillator) { oscillator.stop(); oscillator.disconnect(); oscillator = null; }
    playing = false;
    win.body.querySelector('#viz-play').textContent = '▶ Play';
    if (animFrame) cancelAnimationFrame(animFrame);
  }

  function animate() {
    if (!playing) return;
    animFrame = requestAnimationFrame(animate);
    resizeCanvas();
    const W = canvas.width, H = canvas.height;
    const mode = win.body.querySelector('#viz-mode').value;

    analyser.getByteFrequencyData(dataArray);
    ctxC.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctxC.fillRect(0, 0, W, H);

    const bufLen = dataArray.length;

    if (mode === 'bars') {
      const barW = (W / bufLen) * 2;
      for (let i = 0; i < bufLen; i++) {
        const barH = (dataArray[i] / 255) * H;
        const hue = (i / bufLen) * 360;
        ctxC.fillStyle = `hsl(${hue}, 100%, 50%)`;
        ctxC.fillRect(i * barW, H - barH, barW - 1, barH);
      }
    } else if (mode === 'waveform') {
      const timeData = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(timeData);
      ctxC.lineWidth = 2;
      ctxC.strokeStyle = '#00ff00';
      ctxC.beginPath();
      const sliceW = W / timeData.length;
      for (let i = 0; i < timeData.length; i++) {
        const v = timeData[i] / 128.0;
        const y = v * H / 2;
        if (i === 0) ctxC.moveTo(0, y);
        else ctxC.lineTo(i * sliceW, y);
      }
      ctxC.stroke();
      // Mirror wave
      ctxC.strokeStyle = 'rgba(0, 255, 0, 0.3)';
      ctxC.beginPath();
      for (let i = 0; i < timeData.length; i++) {
        const v = timeData[i] / 128.0;
        const y = H - v * H / 2;
        if (i === 0) ctxC.moveTo(0, y);
        else ctxC.lineTo(i * sliceW, y);
      }
      ctxC.stroke();
    } else if (mode === 'circular') {
      const cx = W / 2, cy = H / 2;
      const radius = Math.min(W, H) * 0.3;
      for (let i = 0; i < bufLen; i++) {
        const angle = (i / bufLen) * Math.PI * 2;
        const amp = (dataArray[i] / 255) * radius;
        const x1 = cx + Math.cos(angle) * radius;
        const y1 = cy + Math.sin(angle) * radius;
        const x2 = cx + Math.cos(angle) * (radius + amp);
        const y2 = cy + Math.sin(angle) * (radius + amp);
        const hue = (i / bufLen) * 360;
        ctxC.strokeStyle = `hsl(${hue}, 100%, 50%)`;
        ctxC.lineWidth = 2;
        ctxC.beginPath();
        ctxC.moveTo(x1, y1);
        ctxC.lineTo(x2, y2);
        ctxC.stroke();
      }
      // Center circle
      ctxC.strokeStyle = '#fff';
      ctxC.lineWidth = 1;
      ctxC.beginPath();
      ctxC.arc(cx, cy, radius, 0, Math.PI * 2);
      ctxC.stroke();
    }
  }

  win.body.querySelector('#viz-play').addEventListener('click', () => {
    if (playing) stopPlayback();
    else startPlayback();
  });

  win.body.querySelector('#viz-wave').addEventListener('change', (e) => {
    if (oscillator) oscillator.type = e.target.value;
  });

  win.body.querySelector('#viz-freq').addEventListener('input', (e) => {
    if (oscillator) oscillator.frequency.value = parseInt(e.target.value);
  });

  win.body.querySelector('#viz-vol').addEventListener('input', (e) => {
    if (gainNode) gainNode.gain.value = parseInt(e.target.value) / 100;
  });

  // Piano keyboard (click to play notes)
  const pianoDiv = document.createElement('div');
  pianoDiv.style.cssText = 'position:absolute;top:4px;left:4px;display:flex;gap:1px;z-index:5;';
  const notes = [
    { key: 'C', freq: 261.63, color: '#fff' },
    { key: 'C#', freq: 277.18, color: '#333' },
    { key: 'D', freq: 293.66, color: '#fff' },
    { key: 'D#', freq: 311.13, color: '#333' },
    { key: 'E', freq: 329.63, color: '#fff' },
    { key: 'F', freq: 349.23, color: '#fff' },
    { key: 'F#', freq: 369.99, color: '#333' },
    { key: 'G', freq: 392.00, color: '#fff' },
    { key: 'G#', freq: 415.30, color: '#333' },
    { key: 'A', freq: 440.00, color: '#fff' },
    { key: 'A#', freq: 466.16, color: '#333' },
    { key: 'B', freq: 493.88, color: '#fff' },
    { key: 'C5', freq: 523.25, color: '#fff' },
  ];

  notes.forEach(note => {
    const key = document.createElement('div');
    const isBlack = note.color === '#333';
    key.style.cssText = `
      width: ${isBlack ? '14px' : '20px'};
      height: ${isBlack ? '40px' : '60px'};
      background: ${note.color};
      border: 1px solid #000;
      cursor: pointer;
      display: flex; align-items: flex-end; justify-content: center;
      font-size: 7px; color: ${isBlack ? '#aaa' : '#666'};
      padding-bottom: 2px;
      ${isBlack ? 'margin: 0 -6px; z-index: 2; position: relative;' : ''}
    `;
    key.textContent = note.key;
    key.title = `${note.key} (${note.freq}Hz)`;

    const playNote = () => {
      if (!audioCtx) setupAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = win.body.querySelector('#viz-wave').value;
      osc.frequency.value = note.freq;
      g.gain.setValueAtTime(0.2, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
      osc.connect(g);
      g.connect(analyser || audioCtx.destination);
      if (analyser) analyser.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
      key.style.background = isBlack ? '#555' : '#ddd';
      setTimeout(() => { key.style.background = note.color; }, 150);

      // If visualizer not running, do a quick animation frame
      if (!playing) {
        if (!analyser) { setupAudio(); g.connect(analyser); analyser.connect(audioCtx.destination); }
        const quickAnim = () => {
          resizeCanvas();
          const W = canvas.width, H = canvas.height;
          analyser.getByteFrequencyData(dataArray);
          ctxC.fillStyle = 'rgba(0, 0, 0, 0.15)';
          ctxC.fillRect(0, 0, W, H);
          const bufLen = dataArray.length;
          const barW = (W / bufLen) * 2;
          for (let i = 0; i < bufLen; i++) {
            const barH = (dataArray[i] / 255) * H;
            const hue = (i / bufLen) * 360;
            ctxC.fillStyle = `hsl(${hue}, 100%, 50%)`;
            ctxC.fillRect(i * barW, H - barH, barW - 1, barH);
          }
          if (dataArray.some(v => v > 2)) requestAnimationFrame(quickAnim);
        };
        requestAnimationFrame(quickAnim);
      }
    };

    key.addEventListener('mousedown', playNote);
    key.addEventListener('touchstart', (e) => { e.preventDefault(); playNote(); }, { passive: false });
    pianoDiv.appendChild(key);
  });

  canvas.parentElement.appendChild(pianoDiv);

  // Keyboard to piano mapping
  const keyMap = { 'a': 0, 'w': 1, 's': 2, 'e': 3, 'd': 4, 'f': 5, 't': 6, 'g': 7, 'y': 8, 'h': 9, 'u': 10, 'j': 11, 'k': 12 };
  win.el.addEventListener('keydown', (e) => {
    const idx = keyMap[e.key.toLowerCase()];
    if (idx !== undefined) {
      const keyEl = pianoDiv.children[idx];
      if (keyEl) keyEl.dispatchEvent(new Event('mousedown'));
    }
  });

  // Preset patterns
  const presets = [
    { name: 'Alarm', freqs: [800, 600, 800, 600], dur: 0.15 },
    { name: 'Siren', freqs: [400, 500, 600, 700, 800, 700, 600, 500], dur: 0.1 },
    { name: 'Melody', freqs: [523, 587, 659, 698, 784, 698, 659, 587], dur: 0.2 },
  ];

  // Add preset buttons to controls
  const controls = win.body.querySelector('.viz-controls');
  const presetLabel = document.createElement('span');
  presetLabel.textContent = 'Presets:';
  presetLabel.style.marginLeft = '8px';
  controls.appendChild(presetLabel);

  presets.forEach(preset => {
    const btn = document.createElement('button');
    btn.textContent = preset.name;
    btn.style.cssText = 'background:#222;color:#0f0;border:1px solid #0f0;padding:2px 6px;cursor:pointer;font-size:10px;';
    btn.addEventListener('click', () => {
      if (!audioCtx) setupAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      preset.freqs.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.15, audioCtx.currentTime + i * preset.dur);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (i + 1) * preset.dur);
        osc.connect(g);
        g.connect(analyser || audioCtx.destination);
        if (analyser) analyser.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * preset.dur);
        osc.stop(audioCtx.currentTime + (i + 1) * preset.dur);
      });
    });
    controls.appendChild(btn);
  });

  win.data.onClose = () => {
    stopPlayback();
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
  };

  resizeCanvas();
  win.data.onResize = resizeCanvas;
};

Apps.weather = function() {
  const existing = WM.findByApp('weather');
  if (existing) { WM.focus(existing.id); return; }

  const conditions = [
    { name: 'Sunny', icon: '☀️', tempHigh: 82, tempLow: 65 },
    { name: 'Partly Cloudy', icon: '⛅', tempHigh: 75, tempLow: 60 },
    { name: 'Cloudy', icon: '☁️', tempHigh: 68, tempLow: 55 },
    { name: 'Rainy', icon: '🌧️', tempHigh: 58, tempLow: 48 },
    { name: 'Stormy', icon: '⛈️', tempHigh: 55, tempLow: 45 },
    { name: 'Snowy', icon: '❄️', tempHigh: 30, tempLow: 20 },
    { name: 'Windy', icon: '💨', tempHigh: 65, tempLow: 50 },
    { name: 'Foggy', icon: '🌫️', tempHigh: 60, tempLow: 50 },
  ];

  // Generate fake but realistic-looking forecast
  const today = conditions[Math.floor(Math.random() * conditions.length)];
  const todayTemp = today.tempHigh - Math.floor(Math.random() * 5);
  const humidity = 40 + Math.floor(Math.random() * 40);
  const wind = 5 + Math.floor(Math.random() * 20);

  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const todayIdx = new Date().getDay();
  const forecast = [];
  for (let i = 1; i <= 5; i++) {
    const c = conditions[Math.floor(Math.random() * conditions.length)];
    const variation = Math.floor(Math.random() * 10) - 5;
    forecast.push({
      day: dayNames[(todayIdx + i) % 7],
      icon: c.icon,
      high: c.tempHigh + variation,
      low: c.tempLow + variation,
      name: c.name,
    });
  }

  const win = WM.createWindow({
    title: 'Weather', icon: '🌤️', appType: 'weather',
    width: 360, height: 380, minWidth: 280, minHeight: 300,
    body: `
      <div class="weather-container">
        <div class="weather-today">
          <div>📍 RetroCity, RD</div>
          <div class="weather-icon-big weather-anim">${today.icon}</div>
          <div class="temp-big">${todayTemp}°F</div>
          <div>${today.name}</div>
          <div style="font-size:12px;margin-top:6px;opacity:0.8;">
            Humidity: ${humidity}% | Wind: ${wind} mph
          </div>
          <div style="font-size:11px;opacity:0.7;">
            H: ${today.tempHigh}° L: ${today.tempLow}°
          </div>
        </div>
        <div style="font-weight:bold;margin-bottom:6px;">5-Day Forecast</div>
        <div class="weather-forecast">
          ${forecast.map(f => `
            <div class="weather-day">
              <div style="font-weight:bold;">${f.day}</div>
              <div class="day-icon weather-anim" style="animation-delay:${Math.random()}s;">${f.icon}</div>
              <div style="font-size:11px;">${f.high}°/${f.low}°</div>
              <div style="font-size:10px;opacity:0.8;">${f.name}</div>
            </div>
          `).join('')}
        </div>
        <div style="font-weight:bold;margin:10px 0 6px;">Hourly</div>
        <div style="display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;">
          ${Array.from({length: 12}, (_, i) => {
            const hour = (new Date().getHours() + i + 1) % 24;
            const hourStr = hour === 0 ? '12AM' : hour < 12 ? hour + 'AM' : hour === 12 ? '12PM' : (hour-12) + 'PM';
            const icons = ['☀️','⛅','☁️','🌤️'];
            const temp = todayTemp + Math.floor(Math.random() * 8 - 4);
            return `<div style="min-width:50px;text-align:center;padding:4px;background:rgba(255,255,255,0.1);border-radius:3px;">
              <div style="font-size:10px;">${hourStr}</div>
              <div style="font-size:18px;">${icons[Math.floor(Math.random()*icons.length)]}</div>
              <div style="font-size:11px;">${temp}°</div>
            </div>`;
          }).join('')}
        </div>

        <div style="font-weight:bold;margin:10px 0 6px;">Details</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
          <div style="background:rgba(255,255,255,0.1);padding:6px;border-radius:3px;">
            <div style="font-size:10px;opacity:0.7;">UV Index</div>
            <div style="font-size:16px;font-weight:bold;">${Math.floor(Math.random()*8+1)}</div>
          </div>
          <div style="background:rgba(255,255,255,0.1);padding:6px;border-radius:3px;">
            <div style="font-size:10px;opacity:0.7;">Visibility</div>
            <div style="font-size:16px;font-weight:bold;">${Math.floor(Math.random()*5+5)} mi</div>
          </div>
          <div style="background:rgba(255,255,255,0.1);padding:6px;border-radius:3px;">
            <div style="font-size:10px;opacity:0.7;">Pressure</div>
            <div style="font-size:16px;font-weight:bold;">${1010+Math.floor(Math.random()*20)} mb</div>
          </div>
          <div style="background:rgba(255,255,255,0.1);padding:6px;border-radius:3px;">
            <div style="font-size:10px;opacity:0.7;">Dew Point</div>
            <div style="font-size:16px;font-weight:bold;">${Math.floor(todayTemp*0.6+Math.random()*5)}°F</div>
          </div>
          <div style="background:rgba(255,255,255,0.1);padding:6px;border-radius:3px;">
            <div style="font-size:10px;opacity:0.7;">Sunrise</div>
            <div style="font-size:16px;font-weight:bold;">6:${(15+Math.floor(Math.random()*20)).toString().padStart(2,'0')} AM</div>
          </div>
          <div style="background:rgba(255,255,255,0.1);padding:6px;border-radius:3px;">
            <div style="font-size:10px;opacity:0.7;">Sunset</div>
            <div style="font-size:16px;font-weight:bold;">7:${(30+Math.floor(Math.random()*20)).toString().padStart(2,'0')} PM</div>
          </div>
        </div>

        <div style="text-align:center;margin-top:12px;font-size:10px;opacity:0.6;">
          Last updated: ${new Date().toLocaleTimeString()}<br>
          ⚠️ Simulated weather data
        </div>
      </div>
    `,
  });

  // Animated rain/snow effect
  const container = win.body.querySelector('.weather-container');
  if (today.name === 'Rainy' || today.name === 'Stormy') {
    startWeatherAnimation(container, 'rain');
  } else if (today.name === 'Snowy') {
    startWeatherAnimation(container, 'snow');
  }

  function startWeatherAnimation(el, type) {
    const particles = document.createElement('div');
    particles.style.cssText = 'position:absolute;inset:0;overflow:hidden;pointer-events:none;';
    el.style.position = 'relative';
    el.appendChild(particles);

    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      const size = type === 'snow' ? (3 + Math.random() * 4) : 2;
      const left = Math.random() * 100;
      const dur = type === 'snow' ? (3 + Math.random() * 4) : (0.5 + Math.random() * 0.5);
      const delay = Math.random() * 3;
      p.style.cssText = `
        position:absolute; left:${left}%; top:-10px;
        width:${size}px; height:${type === 'snow' ? size : size * 6}px;
        background:${type === 'snow' ? '#fff' : 'rgba(174,194,224,0.6)'};
        border-radius:${type === 'snow' ? '50%' : '0'};
        animation: weatherDrop ${dur}s linear ${delay}s infinite;
        opacity: 0.7;
      `;
      particles.appendChild(p);
    }

    if (!document.getElementById('weather-anim-style')) {
      const style = document.createElement('style');
      style.id = 'weather-anim-style';
      style.textContent = `
        @keyframes weatherDrop {
          from { transform: translateY(-10px) translateX(0); opacity: 0.7; }
          to { transform: translateY(400px) translateX(${type === 'snow' ? '20px' : '0'}); opacity: 0; }
        }
      `;
      document.head.appendChild(style);
    }
  }
};
