// ==========================================
// THEME & WALLPAPER SYSTEM
// ==========================================
let currentWallpaper = 'teal';

function applyTheme(theme) {
  document.body.className = '';
  if (theme !== 'classic') {
    document.body.classList.add('theme-' + theme);
  }
}

function setWallpaper(wp) {
  currentWallpaper = wp;
  applyCurrentWallpaper();
}

function applyCurrentWallpaper() {
  const desktop = document.getElementById('desktop');
  desktop.style.backgroundImage = '';
  switch (currentWallpaper) {
    case 'teal':
      desktop.style.background = 'var(--desktop-bg)';
      break;
    case 'gradient1':
      desktop.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
      break;
    case 'gradient2':
      desktop.style.background = 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)';
      break;
    case 'gradient3':
      desktop.style.background = 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)';
      break;
    case 'stars':
      desktop.style.background = '#111';
      createStarfield(desktop);
      break;
    case 'grid':
      desktop.style.background = '#1a1a2e';
      desktop.style.backgroundImage = `
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px)
      `;
      desktop.style.backgroundSize = '30px 30px';
      break;
    case 'gradient4':
      desktop.style.background = 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)';
      break;
    case 'gradient5':
      desktop.style.background = 'linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)';
      break;
    case 'gradient6':
      desktop.style.background = 'linear-gradient(to right, #0f0c29, #302b63, #24243e)';
      break;
    case 'matrix':
      desktop.style.background = '#000';
      createMatrixWallpaper(desktop);
      break;
  }
}

function createMatrixWallpaper(desktop) {
  // Remove existing
  const existingCanvas = desktop.querySelector('.matrix-wallpaper');
  if (existingCanvas) existingCanvas.remove();

  const canvas = document.createElement('canvas');
  canvas.className = 'matrix-wallpaper';
  canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.3;z-index:0;';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  desktop.insertBefore(canvas, desktop.firstChild);

  const ctx = canvas.getContext('2d');
  const cols = Math.floor(canvas.width / 16);
  const drops = new Array(cols).fill(0).map(() => Math.random() * canvas.height / 16);
  const chars = 'アイウエオカキクケコサシスセソタチツテト0123456789ABCDEF';

  function drawMatrix() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0f0';
    ctx.font = '14px monospace';
    for (let i = 0; i < cols; i++) {
      const char = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(char, i * 16, drops[i] * 16);
      if (drops[i] * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }

  const matrixInterval = setInterval(drawMatrix, 50);
  canvas._interval = matrixInterval;

  // Store cleanup reference
  if (!desktop._matrixCleanup) {
    desktop._matrixCleanup = [];
  }
  desktop._matrixCleanup.push(matrixInterval);
}

function createStarfield(desktop) {
  // Remove existing stars
  desktop.querySelectorAll('.star').forEach(s => s.remove());
  for (let i = 0; i < 100; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2 + 1;
    star.style.cssText = `
      position: absolute;
      width: ${size}px; height: ${size}px;
      background: #fff; border-radius: 50%;
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 100}%;
      opacity: ${Math.random() * 0.8 + 0.2};
      animation: blink ${2 + Math.random() * 3}s ease-in-out infinite;
      animation-delay: ${Math.random() * 2}s;
      pointer-events: none;
    `;
    desktop.appendChild(star);
  }
}

// ==========================================
// WINDOW SNAP TO EDGES
// ==========================================
const origOnPointerUp = WM.onPointerUp.bind(WM);
WM.onPointerUp = function() {
  if (this.dragState) {
    const wd = this.dragState.wd;
    const el = wd.el;
    const x = parseInt(el.style.left);
    const y = parseInt(el.style.top);
    const snapThreshold = 10;

    // Snap to left edge
    if (x < snapThreshold && x > -el.offsetWidth / 2) {
      el.style.left = '0px';
    }
    // Snap to top edge
    if (y < snapThreshold && y > -20) {
      el.style.top = '0px';
    }
    // Snap to right edge
    const desktop = document.getElementById('desktop');
    if (x + el.offsetWidth > desktop.offsetWidth - snapThreshold) {
      el.style.left = (desktop.offsetWidth - el.offsetWidth) + 'px';
    }
    // Snap to bottom edge
    if (y + el.offsetHeight > desktop.offsetHeight - snapThreshold) {
      el.style.top = (desktop.offsetHeight - el.offsetHeight) + 'px';
    }
  }
  origOnPointerUp.call(this);
};

// ==========================================
// GLOBAL KEYBOARD SHORTCUTS
// ==========================================
document.addEventListener('keydown', (e) => {
  // Ctrl+Shift+T: Open Terminal
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'T') {
    e.preventDefault();
    Apps.terminal();
  }
  // Ctrl+Shift+E: Open File Manager
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'E') {
    e.preventDefault();
    Apps.fileManager();
  }
  // F1: Help
  if (e.key === 'F1') {
    e.preventDefault();
    Apps.helpApp();
  }
  // Escape: Close start menu
  if (e.key === 'Escape') {
    startMenu.classList.remove('visible');
    ContextMenu.hide();
  }
});

// ==========================================
// PERFORMANCE: CLOCK UPDATE OPTIMIZATION
// ==========================================
// Use requestAnimationFrame for smooth clock
let lastClockUpdate = 0;
function clockLoop(timestamp) {
  if (timestamp - lastClockUpdate > 10000) {
    updateClock();
    lastClockUpdate = timestamp;
  }
  requestAnimationFrame(clockLoop);
}
requestAnimationFrame(clockLoop);

// ==========================================
// MOBILE: PREVENT ZOOM ON DOUBLE TAP
// ==========================================
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    // Allow double-tap on desktop icons (already handled)
    if (!e.target.closest('.desktop-icon') && !e.target.closest('.fm-item')) {
      e.preventDefault();
    }
  }
  lastTouchEnd = now;
}, { passive: false });

// ==========================================
// WINDOW CLOSE ALL SHORTCUT
// ==========================================
function closeAllWindows() {
  const ids = WM.windows.map(w => w.id);
  ids.forEach(id => WM.close(id));
}

// ==========================================
// AUTO SAVE STATE (in-memory)
// ==========================================
const StateManager = {
  _state: {},

  save(key, value) {
    this._state[key] = value;
  },

  load(key, defaultValue) {
    return this._state[key] !== undefined ? this._state[key] : defaultValue;
  }
};

init();
